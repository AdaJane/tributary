[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/AdaJane/tributary"

[workspace.dependencies]
trib-core = { path = "crates/trib-core" }
trib-dsp = { path = "crates/trib-dsp" }
trib-engine = { path = "crates/trib-engine" }
trib-audio = { path = "crates/trib-audio" }
trib-project = { path = "crates/trib-project" }

rtrb = "0.3"
cpal = "0.16"
biquad = "0.5"
hound = "3"
toml = "0.9"
flacenc = { version = "0.5", default-features = false }
symphonia = { version = "0.6", default-features = false, features = ["flac"] }
rayon = "1"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = { version = "8", features = ["mime-guess"] }
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
clap = { version = "4", features = ["derive"] }

tempfile = "3"
assert_no_alloc = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
