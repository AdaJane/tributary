[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.5.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/AdaJane/tributary"

[workspace.dependencies]
trib-core = { path = "crates/trib-core" }
trib-dsp = { path = "crates/trib-dsp" }
trib-engine = { path = "crates/trib-engine" }
trib-audio = { path = "crates/trib-audio" }
trib-project = { path = "crates/trib-project" }

rtrb = "0.3"
cpal = "0.16"
# Direct ALSA for the real-time backend. Already in the tree as a
# transitive dependency of cpal and midir — promoting it to a direct one
# adds no supply-chain surface and no new system package, since `hardware`
# already requires the ALSA headers.
alsa = "0.9"
# SCHED_FIFO on the audio thread. `rustix` gives us `getrlimit`, `mlockall`
# and `sched_setaffinity` but has no scheduler-policy setter, and the
# workspace forbids `unsafe_code` — so a safe wrapper is the only way to
# ask for real-time scheduling at all.
thread-priority = "1"
biquad = "0.5"
# SoundFont synthesis for virtual instruments. Pure Rust with no dependencies
# beyond std, so it stays unconditional: instruments render even in builds
# without ALSA headers (`--no-default-features`), where the fake backend runs.
rustysynth = "1.3"
# MIDI input over the ALSA sequencer. Adds no system package: its only
# Linux dependencies are `alsa` — already in the tree via cpal — and libc.
# Default features are empty; JACK is opt-in and we do not want it.
midir = { version = "0.11", default-features = false }
# NOTE: no MIDI-file crate. The take sidecar is written by
# `trib-project/src/midi.rs` — about 120 lines, because we only ever WRITE
# a format-0 file and never parse one. `peaks.rs` sets the precedent for a
# hand-rolled binary format here, and the writer is pinned by a byte-exact
# test, which is most of what a dependency would have bought.
# MIDI file PARSING for take playback. The writer in
# `trib-project/src/midi.rs` stays hand-rolled — we emit exactly one shape
# and a byte-exact test pins it — but reading is a different job: a bad
# length prefix is a panic or an OOM, and a take directory copied from
# another machine can hold a format-1 file this daemon never wrote. Every
# other binary media format here already READS through a crate (hound for
# WAV, symphonia for FLAC); this is that rule, not an exception to it.
# Pairing our own reader with our own writer would also only ever have
# round-tripped our own bugs.
midly = { version = "0.5", default-features = false, features = ["std"] }
hound = "3"
toml = "0.9"
flacenc = { version = "0.5", default-features = false }
symphonia = { version = "0.6", default-features = false, features = ["flac"] }
rayon = "1"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
# poll(2) on /proc/self/mountinfo for POLLPRI — the kernel's own "the mount
# table changed" signal. The workspace forbids `unsafe_code`, so the raw
# syscall needs a safe wrapper rather than an inline extern block.
rustix = { version = "1", features = ["event", "mm", "process"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    # Soundfont uploads stream to disk rather than buffering: a 64 MB file
    # held in memory on a Pi is the OOM the size limit exists to prevent.
    "fs",
    "io-util",
] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = { version = "8", features = ["mime-guess"] }
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
clap = { version = "4", features = ["derive"] }

tempfile = "3"
assert_no_alloc = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
