# Tributary daemon configuration. Every key is optional; the values shown are
# the defaults. Environment overrides use TRIB__SECTION__KEY, e.g.
# TRIB__SERVER__BIND=0.0.0.0:4600.

[server]
# bind = "127.0.0.1:4600"
# Loopback origins pass on any port, and so does a same-origin page on a
# `.local` or IP-literal host (the LAN appliance case); list other extras
# (reverse proxies, custom DNS names) here. No auth: the daemon trusts
# the machine/network it is reachable on.
# cors_origins = []

[audio]
# Inputs open per-device on demand (patch a strip to open one); the output
# is the system default device and provides the clock. No resampling —
# devices open at the engine rate (PipeWire adapts; raw ALSA may refuse).
# sample_rate = 48000
# block_size = 256

[projects]
# root = "projects"

[soundfonts]
# Where virtual instruments load their .sf2 files from. On the boot disk,
# never under the recording destination — that follows whatever USB stick
# is mounted, and an instrument would lose its sound every time it moved.
# Uploads land here; mounted drives are also scanned, one level deep.
# root = "soundfonts"
#
# Ceiling on an uploaded soundfont. This is a MEMORY budget wearing a disk
# hat: the synthesiser holds all sample data resident, so a 148 MB General
# MIDI set is an OOM kill on a Pi Zero 2 W rather than a slow load.
# max_bytes = 67108864
