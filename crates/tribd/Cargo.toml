[package]
name = "tribd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Tributary daemon: recording engine host with an HTTP/WS control surface"

[features]
# Real device IO via cpal is the default. Needs ALSA headers on Linux
# (libasound2-dev); build with --no-default-features for the fake backend
# (test tone, no devices) on header-less machines.
default = ["hardware"]
hardware = ["trib-audio/cpal-backend"]
# Bakes web/dist into the binary so one file serves console + API. Opt-in:
# plain builds never require the web build to exist. Used by `just dist`
# and the release workflow.
embed-ui = ["dep:rust-embed"]

[dependencies]
trib-core = { workspace = true, features = ["openapi"] }
trib-dsp.workspace = true
trib-engine.workspace = true
trib-audio.workspace = true
trib-project = { workspace = true, features = ["openapi"] }
rtrb.workspace = true

axum.workspace = true
clap.workspace = true
config.workspace = true
futures.workspace = true
rust-embed = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
hound.workspace = true
tempfile.workspace = true

[lints]
workspace = true
