[package]
name = "tribd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Tributary daemon: recording engine host with an HTTP/WS control surface"

[features]
# Real device IO via cpal is the default. Needs ALSA headers on Linux
# (libasound2-dev); build with --no-default-features for the fake backend
# (test tone, no devices) on header-less machines.
default = ["hardware"]
# midir joins cpal here because it links libasound too. Instruments
# themselves stay unconditional (rustysynth is pure Rust), so a
# --no-default-features build still renders them — it just has no external
# MIDI in, and tests drive the event ring directly.
hardware = ["trib-audio/cpal-backend", "trib-audio/alsa-backend", "dep:midir"]
# Bakes web/dist into the binary so one file serves console + API. Opt-in:
# plain builds never require the web build to exist. Used by `just dist`
# and the release workflow.
embed-ui = ["dep:rust-embed"]

[dependencies]
trib-core = { workspace = true, features = ["openapi"] }
trib-dsp.workspace = true
trib-engine.workspace = true
trib-audio.workspace = true
trib-project = { workspace = true, features = ["openapi"] }
rtrb.workspace = true

axum.workspace = true
clap.workspace = true
config.workspace = true
futures.workspace = true
midir = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
hound.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# ---------------------------------------------------------------------------
# Distribution metadata (cargo-deb / cargo-generate-rpm). Both tools read
# the workspace-inherited version, so the "tag == workspace version" assert
# in release.yml stays the single version gate.

[package.metadata.deb]
name = "tributary"
maintainer = "Ada Jane <ada@somepanic.com>"
copyright = "Tributary contributors"
extended-description = """\
Live multitrack recording and mixing console. The tribd daemon owns all
realtime audio — patching, mixing, FX, recording, playback — and serves the
browser console (embedded in the binary) plus a REST/WebSocket API at
http://127.0.0.1:4600."""
section = "sound"
# Explicit and unversioned: $auto on the build runner would emit
# libasound2t64, absent on Debian 12; unversioned libasound2 resolves
# everywhere modern via the t64 package's versioned Provides.
depends = "libasound2, adduser"
# pactl/parec unlock the friendly-named patchbay sources on Pulse/PipeWire
# desktops; without them the daemon falls back to raw ALSA devices.
recommends = "pulseaudio-utils"
# Local `cargo deb` builds embed the console; CI passes --no-build and
# packages the leg's own --features embed-ui binary.
features = ["embed-ui"]
maintainer-scripts = "../../packaging/deb"
conf-files = ["/etc/tributary/tribd.toml"]
assets = [
  ["target/release/tribd", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/tributary/", "644"],
  ["../../THIRD-PARTY.md", "usr/share/doc/tributary/", "644"],
  # The commented defaults, shipped verbatim — one source of truth.
  ["../../config/tribd.toml", "etc/tributary/tribd.toml", "644"],
  # The bundled SoundFonts, so instruments have something to play on a
  # fresh install. Fetched by scripts/fetch-soundfonts.sh (never committed:
  # ~380 MB of PCM), and this glob is empty on a build that skipped the
  # fetch — which packages cleanly and reports an empty library rather
  # than failing. `builtin_root` in the shipped tribd.toml points here.
  ["../../soundfonts/dist/*.sf2", "usr/share/tributary/soundfonts/", "644"],
]

[package.metadata.deb.systemd-units]
unit-name = "tribd"
unit-scripts = "../../packaging/systemd"
# Debian server convention: installed means running (loopback bind).
enable = true
start = true
restart-after-upgrade = true

[package.metadata.generate-rpm]
name = "tributary"
summary = "Live multitrack recording and mixing console (tribd daemon)"
# Requires are declared by soname below — distro-neutral (alsa-lib on
# Fedora, alsa on openSUSE); cargo-generate-rpm runs no auto-dep generator.
auto-req = "disabled"
assets = [
  { source = "target/release/tribd", dest = "/usr/bin/tribd", mode = "755" },
  { source = "packaging/systemd/tribd.service", dest = "/usr/lib/systemd/system/tribd.service", mode = "644" },
  { source = "config/tribd.toml", dest = "/etc/tributary/tribd.toml", mode = "644", config = "noreplace" },
  { source = "README.md", dest = "/usr/share/doc/tributary/README.md", mode = "644", doc = true },
  { source = "THIRD-PARTY.md", dest = "/usr/share/doc/tributary/THIRD-PARTY.md", mode = "644", doc = true },
  # As for the deb — note these paths are relative to the WORKSPACE root,
  # where cargo-deb's are relative to this crate. The asymmetry is
  # cargo-generate-rpm's, not ours.
  { source = "soundfonts/dist/*.sf2", dest = "/usr/share/tributary/soundfonts/", mode = "644" },
]
# Fedora/openSUSE convention: ship the unit preset-disabled; admins opt in
# with `systemctl enable --now tribd` (the deb's enable+start would violate
# least surprise on RPM distros).
pre_install_script = """
getent group tributary >/dev/null || groupadd -r tributary
getent passwd tributary >/dev/null || \
  useradd -r -g tributary -d /var/lib/tributary -s /sbin/nologin tributary
"""
post_install_script = """
chown root:tributary /etc/tributary && chmod 0775 /etc/tributary
systemctl daemon-reload >/dev/null 2>&1 || :
[ "$1" -eq 1 ] && systemctl preset tribd.service >/dev/null 2>&1 || :
"""
pre_uninstall_script = """
[ "$1" -eq 0 ] && systemctl --no-reload disable --now tribd.service >/dev/null 2>&1 || :
"""
post_uninstall_script = """
systemctl daemon-reload >/dev/null 2>&1 || :
[ "$1" -ge 1 ] && systemctl try-restart tribd.service >/dev/null 2>&1 || :
"""

[package.metadata.generate-rpm.requires]
"libasound.so.2()(64bit)" = "*"
