# Tributary appliance configuration. Every other key keeps its default —
# see config/tribd.toml in the repo for the full commented set; env
# overrides are TRIB__SECTION__KEY.

[server]
# LAN-open by design: browse http://tributary.local from any device on the
# appliance's own Wi-Fi network or a plugged-in ethernet LAN — no port to
# type. Binding 80 works because build.sh lowers the unprivileged port
# floor (/etc/sysctl.d/80-tributary.conf); tribd runs as a user unit and
# cannot be granted CAP_NET_BIND_SERVICE. The daemon trusts this network —
# see the Security section of the README before putting it on one you don't.
bind = "0.0.0.0:80"

[audio]
# The appliance takes one ALSA card outright: capture and playback linked
# on a single clock, the engine clocked by the card, and no server in the
# path. Nothing else on this box can make a sound, which is the point.
#
# `device` is unset, so the daemon takes the first card that opens duplex
# at the engine rate, and keeps trying every few seconds until one does —
# plug the interface in whenever. Set it ("hw:1") if more than one
# interface is ever plugged in — the real-time backend owns exactly one.
#
# The image keeps PipeWire off USB interfaces so it cannot hold the card
# (/etc/wireplumber/wireplumber.conf.d/99-tributary-fence.conf). Switching
# this to "shared" needs that file deleted, or PipeWire never sees the
# interface either.
layer = "exclusive"
